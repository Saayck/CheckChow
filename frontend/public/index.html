<!DOCTYPE html>

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json proporciona metadatos usados cuando la aplicacion web se instala
      en un dispositivo movil o escritorio. Consulta https://developers.google.com/web/fundamentals/web-app-manifest/

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Observa el uso de %PUBLIC_URL% en las etiquetas anteriores.
      Se reemplazara por la URL de la carpeta `public` durante la compilacion.
      Desde este HTML solo se pueden referenciar archivos dentro de `public`.

      A diferencia de "/favicon.ico" o "favicon.ico", "%PUBLIC_URL%/favicon.ico"
      funcionara correctamente con enrutamiento del cliente y con una URL publica
      que no este en la raiz. Aprende a configurarla ejecutando `npm run build`.
    -->
    <title>CheckChow</title>
  </head>

      Este archivo HTML es una plantilla.

      Puedes agregar fuentes web, metaetiquetas o analitica en este archivo.

      Para iniciar el desarrollo, ejecuta `npm start` o `yarn start`.
      Para crear un paquete de produccion, usa `npm run build` o `yarn build`.
    -->
  </body>
